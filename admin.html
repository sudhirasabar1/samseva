<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - liveSEVA</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Chhote buttons ke liye extra styling */
        .btn-action {
            padding: 5px 8px;
            font-size: 11px;
            width: auto;
            margin: 2px;
            border-radius: 4px;
        }
        .btn-view { background-color: var(--primary); color: white; border: none; cursor: pointer;}
        .btn-download { background-color: #2c3e50; color: white; border: none; cursor: pointer;}
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div id="loginScreen" style="display: flex; justify-content: center; align-items: center; height: 100vh;">
        <div class="form-container" style="width: 100%; max-width: 400px;">
            <h2 style="text-align: center; color: var(--primary); margin-bottom: 20px;">Admin Login</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="adminEmail" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="adminPassword" required>
                </div>
                <button type="submit" class="btn" id="loginBtn">Login</button>
            </form>
            <p id="loginError" style="color: red; text-align: center; margin-top: 10px;"></p>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" style="display: none;">
        <header>
            <div class="logo">liveSEVA Admin</div>
            <button class="btn" style="width: auto; padding: 8px 16px;" onclick="logout()">Logout</button>
        </header>

        <div class="container">
            <h2 class="section-title">Applications Dashboard</h2>
            
            <div style="margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap;">
                <input type="text" id="searchInput" placeholder="Search by Name, Mobile, or ID" style="padding: 10px; border-radius: 8px; border: 1px solid #ccc; flex-grow: 1;">
                <button class="btn" style="width: auto;" onclick="loadSubmissions()">Refresh</button>
            </div>

            <div class="table-responsive">
                <table id="appsTable">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Customer</th>
                            <th>Service</th>
                            <th>Files</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Rows injected by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        let allSubmissions = [];

        async function checkSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                loadSubmissions();
            }
        }
        checkSession();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            document.getElementById('loginBtn').textContent = 'Logging in...';

            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                document.getElementById('loginError').textContent = error.message;
                document.getElementById('loginBtn').textContent = 'Login';
            } else {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                loadSubmissions();
            }
        });

        async function logout() {
            await supabaseClient.auth.signOut();
            window.location.reload();
        }

        async function loadSubmissions() {
            const { data, error } = await supabaseClient.from('submissions').select('*').order('created_at', { ascending: false });
            if (error) return alert('Error: ' + error.message);
            allSubmissions = data;
            renderTable(allSubmissions);
        }

        function renderTable(subs) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            if (subs.length === 0) return tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No data found.</td></tr>';

            subs.forEach(sub => {
                const tr = document.createElement('tr');
                const date = new Date(sub.created_at).toLocaleString();
                
                // Files Array (JSONB) ko parse karke View aur Download buttons banana
                let filesHtml = '';
                if (sub.files && sub.files.length > 0) {
                    sub.files.forEach(file => {
                        // File ka naam nikalne ke liye
                        const fileName = file.name || `${file.type}.${file.path.split('.').pop()}`;
                        filesHtml += `
                            <div style="display: flex; gap: 5px; margin-bottom: 5px;">
                                <button class="btn-action btn-view" onclick="viewFile('${file.path}')">👁 View</button>
                                <button class="btn-action btn-download" onclick="downloadFile('${file.path}', '${fileName}')">⬇ Download</button>
                            </div>
                        `;
                    });
                } else {
                    filesHtml = '<span style="color: #888;">No files</span>';
                }

                tr.innerHTML = `
                    <td>${date}<br><small>ID: ${sub.id.substring(0,8)}...</small></td>
                    <td>${sub.customer_name}<br><small>${sub.mobile}</small></td>
                    <td>${sub.service}</td>
                    <td>${filesHtml}</td>
                    <td>
                        <select onchange="updateStatus('${sub.id}', this.value)" style="padding: 5px; border-radius: 4px;">
                            <option value="Pending" ${sub.status === 'Pending' ? 'selected' : ''}>Pending</option>
                            <option value="Processing" ${sub.status === 'Processing' ? 'selected' : ''}>Processing</option>
                            <option value="Completed" ${sub.status === 'Completed' ? 'selected' : ''}>Completed</option>
                            <option value="Rejected" ${sub.status === 'Rejected' ? 'selected' : ''}>Rejected</option>
                        </select>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const search = e.target.value.toLowerCase();
            const filtered = allSubmissions.filter(sub => 
                sub.customer_name.toLowerCase().includes(search) || 
                sub.mobile.includes(search) || 
                sub.id.toLowerCase().includes(search)
            );
            renderTable(filtered);
        });

        async function updateStatus(id, newStatus) {
            const { error } = await supabaseClient.from('submissions').update({ status: newStatus }).eq('id', id);
            if (error) alert('Error updating status: ' + error.message);
            else loadSubmissions();
        }

        // File View karne ke liye (Nayi Tab mein khulega)
        async function viewFile(path) {
            const { data, error } = await supabaseClient.storage.from('customer-documents').createSignedUrl(path, 60);
            if (error) alert("Error: " + error.message);
            else window.open(data.signedUrl, '_blank');
        }

        // File Download karne ke liye (Blob method use karke)
        async function downloadFile(path, originalFileName) {
            try {
                // 1. 60 seconds ke liye secure temporary link banayein
                const { data, error } = await supabaseClient.storage.from('customer-documents').createSignedUrl(path, 60);
                if (error) throw error;

                // 2. Us link se file ko fetch karein
                const response = await fetch(data.signedUrl);
                if (!response.ok) throw new Error("File fetch failed");
                
                // 3. File data ko Blob mein convert karein
                const blob = await response.blob();
                
                // 4. Ek temporary download link banayein
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                
                // File ka naam set karein (Jaise: photo.jpg ya document.pdf)
                a.download = originalFileName; 
                
                document.body.appendChild(a);
                a.click(); // Download trigger karein
                
                // 5. Memory clean karein
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);

            } catch (error) {
                console.error(error);
                alert("Download Error: " + error.message);
            }
        }
    </script>
</body>
</html>
