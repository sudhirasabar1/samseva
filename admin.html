
<!DOCTYPE html>
<html lang="or">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAMSEVA Admin</title>
<style>
body{margin:0;background:#f1f6f3;font-family:Arial,sans-serif;color:#183b2b}
header{background:#087653;color:white;padding:20px}
main{max-width:1000px;margin:25px auto;padding:15px}
.card{background:white;padding:22px;border-radius:14px;margin-bottom:18px;box-shadow:0 4px 20px #0001}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccd9d0;border-radius:8px;box-sizing:border-box}
button{background:#087653;color:white;padding:10px 15px;border:0;border-radius:7px;cursor:pointer;margin:5px}
.delete{background:#c0392b}
.file{padding:10px;border-top:1px solid #eee}
.hidden{display:none}
</style>
</head>
<body>
<header><h2>SAMSEVA ADMIN PANEL</h2></header>
<main>
<div class="card" id="login">
<h2>Admin Login</h2>
<input id="email" type="email" placeholder="Admin Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="error"></p>
</div>

<div id="dashboard" class="hidden">
<div class="card">
<h2>Customer Documents</h2>
<button onclick="loadData()">Refresh</button>
<button onclick="logout()">Logout</button>
</div>
<div id="records"></div>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const db=supabase.createClient(
SAMSEVA_CONFIG.SUPABASE_URL,
SAMSEVA_CONFIG.SUPABASE_ANON_KEY
);

async function login(){
const {error}=await db.auth.signInWithPassword({
email:document.getElementById("email").value,
password:document.getElementById("password").value
});
if(error){
document.getElementById("error").textContent="Login failed. Check details.";
return;
}
document.getElementById("login").classList.add("hidden");
document.getElementById("dashboard").classList.remove("hidden");
loadData();
}

async function logout(){
await db.auth.signOut();
location.reload();
}

async function loadData(){
const box=document.getElementById("records");
box.innerHTML="Loading...";
const {data,error}=await db.from("submissions")
.select("*").order("created_at",{ascending:false});

if(error){box.innerHTML="Unable to load records.";return;}
if(!data.length){box.innerHTML="No documents uploaded yet.";return;}

box.innerHTML="";
data.forEach(row=>{
const card=document.createElement("div");
card.className="card";
const title=document.createElement("h3");
title.textContent=row.customer_name+" - "+row.mobile;
card.appendChild(title);

(row.files||[]).forEach(file=>{
const line=document.createElement("div");
line.className="file";
const name=document.createElement("span");
name.textContent=file.name+" ";
const download=document.createElement("button");
download.textContent="Download";
download.onclick=async()=>{
const {data,error}=await db.storage.from("customer-documents")
.createSignedUrl(file.path,60);
if(error){alert("Download failed");return;}
const a=document.createElement("a");
a.href=data.signedUrl;
a.download=file.name;
a.target="_blank";
a.click();
};
line.append(name,download);
card.appendChild(line);
});

const del=document.createElement("button");
del.className="delete";
del.textContent="Delete";
del.onclick=async()=>{
if(!confirm("Delete this customer submission?"))return;
const paths=(row.files||[]).map(f=>f.path);
if(paths.length){
const {error}=await db.storage.from("customer-documents").remove(paths);
if(error){alert("File delete failed");return;}
}
const {error}=await db.from("submissions").delete().eq("id",row.id);
if(error){alert("Record delete failed");return;}
loadData();
};
card.appendChild(del);
box.appendChild(card);
});
}
</script>
</body>
</html>
