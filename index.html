<!DOCTYPE html>
<html lang="or">
<head>
<meta name="monetag" content="7882b1a6c57365902e22455ce585e18f"/>
<script>(function(s){s.dataset.zone='12291060',s.src='https://n6wxm.com/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAMSEVA - Online Document Service</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Oriya:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f7f4;color:#173b2c;font-family:'Noto Sans Oriya',sans-serif}
header{background:#087653;color:white;padding:24px 18px;text-align:center}
.logo{font-size:32px;font-weight:800}
header p{margin:5px 0;font-size:14px}
.container{max-width:650px;margin:35px auto;padding:15px}
.card{background:white;padding:25px;border-radius:18px;box-shadow:0 5px 25px #0001}
h2{text-align:center;font-size:23px}
label{display:block;margin:18px 0 7px;font-weight:700}
input{width:100%;padding:13px;border:1px solid #ccdcd2;border-radius:9px;font-size:15px}
.upload{padding:18px;border:2px dashed #0b9a69;border-radius:12px;background:#f7fcf9}
button{width:100%;padding:15px;background:#087653;color:white;border:0;border-radius:10px;font-size:17px;font-weight:bold;margin-top:22px;cursor:pointer}
button:disabled{opacity:.6}
#message{margin-top:15px;padding:12px;border-radius:9px;display:none;line-height:1.7}
footer{text-align:center;padding:20px;color:#789}

.file-list{margin-top:10px}
.file-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 10px;background:#f7fcf9;border:1px solid #d5ebe0;
  border-radius:8px;margin-top:6px;font-size:13px;gap:8px;
}
.file-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-item button{
  width:auto;padding:4px 10px;margin:0;
  background:#e74c3c;border-radius:6px;font-size:12px;flex-shrink:0;
}
.clear-link{text-align:center;font-size:12px;margin-top:12px}
.clear-link a{color:#789;text-decoration:underline}
</style>
</head>
<body>
<header>
<div class="logo">SAMSEVA</div>
<p>ଆପଣଙ୍କ ଅନଲାଇନ୍ ଡକ୍ୟୁମେଣ୍ଟ ସେବା କେନ୍ଦ୍ର</p>
</header>

<div class="container">
<div class="card">
<h2>ଡକ୍ୟୁମେଣ୍ଟ ଅପଲୋଡ୍ କରନ୍ତୁ</h2>
<p>ଦୟାକରି ଆପଣଙ୍କ ନାମ, ମୋବାଇଲ୍ ନମ୍ବର ଏବଂ ଫାଇଲ୍ ଦିଅନ୍ତୁ।</p>

<form id="uploadForm">
<label>ଆପଣଙ୍କ ନାମ *</label>
<input id="name" required maxlength="100" placeholder="ଆପଣଙ୍କ ନାମ">

<label>ମୋବାଇଲ୍ ନମ୍ବର *</label>
<input id="mobile" type="tel" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" required placeholder="10 digit mobile number">

<label>ଫଟୋ / PDF ଅପଲୋଡ୍ କରନ୍ତୁ *</label>
<div class="upload">
  <input id="files" type="file" multiple
         accept="image/jpeg,image/png,image/webp,image/*,application/pdf">
  <p style="font-size:12px;margin:6px 0 0">
    JPG, PNG, WEBP, PDF | Max 10 MB per file |
    <b>ଏକାଧିକ ଫାଇଲ୍ ଚୟନ କରନ୍ତୁ</b>
  </p>
</div>

<div id="fileList" class="file-list"></div>

<button id="submitBtn" type="submit">ଡକ୍ୟୁମେଣ୍ଟ ପଠାନ୍ତୁ</button>
<div id="message"></div>

<p class="clear-link">
  <a href="#" id="clearSaved">ସଞ୍ଚିତ ତଥ୍ୟ ହଟାନ୍ତୁ (Clear saved info)</a>
</p>
</form>
</div>
</div>
<footer>© SAMSEVA | Online Document Service</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const form       = document.getElementById("uploadForm");
const msg        = document.getElementById("message");
const btn        = document.getElementById("submitBtn");
const filesInput = document.getElementById("files");
const fileList   = document.getElementById("fileList");

let pickedFiles = [];

/* -------- AUTO-FILL FROM PREVIOUS VISIT -------- */
window.addEventListener("DOMContentLoaded", () => {
  const savedName   = localStorage.getItem("samseva_name");
  const savedMobile = localStorage.getItem("samseva_mobile");
  if (savedName)   document.getElementById("name").value   = savedName;
  if (savedMobile) document.getElementById("mobile").value = savedMobile;
});

/* -------- FILE SELECT -------- */
filesInput.addEventListener("change", () => {
  [...filesInput.files].forEach(f => {
    const dup = pickedFiles.some(x => x.name === f.name && x.size === f.size);
    if (!dup) pickedFiles.push(f);
  });
  filesInput.value = "";
  renderFiles();
});

/* -------- RENDER FILE LIST -------- */
function renderFiles() {
  fileList.innerHTML = "";
  pickedFiles.forEach((f, i) => {
    const el = document.createElement("div");
    el.className = "file-item";
    el.innerHTML = `<span>📄 ${f.name} (${(f.size / 1024 / 1024).toFixed(2)} MB)</span>`;
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = "✕";
    b.onclick = () => { pickedFiles.splice(i, 1); renderFiles(); };
    el.appendChild(b);
    fileList.appendChild(el);
  });
}

/* -------- SUBMIT -------- */
form.addEventListener("submit", async function (e) {
  e.preventDefault();

  const name   = document.getElementById("name").value.trim();
  const mobile = document.getElementById("mobile").value.trim();

  if (!/^[0-9]{10}$/.test(mobile) || pickedFiles.length === 0) {
    showMsg("ଦୟାକରି ସଠିକ୍ ତଥ୍ୟ ଭରନ୍ତୁ।", "#ffeded");
    return;
  }
  if (pickedFiles.some(f => f.size > 10 * 1024 * 1024)) {
    showMsg("Each file must be under 10 MB", "#ffeded");
    return;
  }

  btn.disabled = true;
  btn.textContent = "Uploading...";

  try {
    const db = supabase.createClient(
      SAMSEVA_CONFIG.SUPABASE_URL,
      SAMSEVA_CONFIG.SUPABASE_ANON_KEY
    );

    const id = crypto.randomUUID();
    const uploaded = [];

    for (let i = 0; i < pickedFiles.length; i++) {
      const file = pickedFiles[i];
      btn.textContent = `Uploading ${i + 1}/${pickedFiles.length}...`;

      const safe = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
      const path = id + "/" + crypto.randomUUID() + "_" + safe;

      const { error } = await db.storage
        .from("customer-documents")
        .upload(path, file, { contentType: file.type });

      if (error) throw error;

      uploaded.push({ name: file.name, path, size: file.size, type: file.type });
    }

    const { error } = await db.from("submissions").insert({
      id, customer_name: name, mobile, files: uploaded
    });
    if (error) throw error;

    /* -------- SAVE FOR NEXT VISIT -------- */
    localStorage.setItem("samseva_name", name);
    localStorage.setItem("samseva_mobile", mobile);

    form.reset();
    pickedFiles = [];
    renderFiles();

    /* Autofill wapas (kyunki form.reset() ne clear kar diya) */
    document.getElementById("name").value   = name;
    document.getElementById("mobile").value = mobile;

    showMsg(
      "ଆପଣଙ୍କ ଡକ୍ୟୁମେଣ୍ଟ ସଫଳତାର ସହିତ ଜମା ହୋଇଛି। Submission ID: " + id,
      "#e7f8ed"
    );

  } catch (err) {
    console.error(err);
    showMsg("Upload ବିଫଳ ହୋଇଛି। ଦୟାକରି ପୁଣି ଚେଷ୍ଟା କରନ୍ତୁ।", "#ffeded");
  } finally {
    btn.disabled = false;
    btn.textContent = "ଡକ୍ୟୁମେଣ୍ଟ ପଠାନ୍ତୁ";
  }
});

/* -------- CLEAR SAVED INFO -------- */
document.getElementById("clearSaved").addEventListener("click", (e) => {
  e.preventDefault();
  localStorage.removeItem("samseva_name");
  localStorage.removeItem("samseva_mobile");
  document.getElementById("name").value = "";
  document.getElementById("mobile").value = "";
  showMsg("ସଞ୍ଚିତ ତଥ୍ୟ ହଟାଗଲା।", "#e7f8ed");
});

/* -------- HELPERS -------- */
function showMsg(text, bg) {
  msg.style.display = "block";
  msg.style.background = bg;
  msg.textContent = text;
}
</script>
</body>
</html>
